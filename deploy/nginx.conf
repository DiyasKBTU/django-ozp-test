# Nginx: статика мен суреттерді өзі береді, қалғанын Gunicorn-ға жібереді.
# Орнату: sudo cp deploy/nginx.conf /etc/nginx/sites-available/ozp-test
#         sudo ln -s /etc/nginx/sites-available/ozp-test /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
# HTTPS (443 порт) бөлігін кейін `certbot --nginx` өзі қосады.
# Егер 443 портты басқа прокси (мысалы, Docker-дегі Caddy) ұстаса, HTTPS-ті сол
# береді де, бұл серверге http арқылы жібереді — INSTRUCTION_RU.md, 7-қадам (Б).

# Django HTTPS екенін X-Forwarded-Proto тақырыбынан біледі (SECURE_PROXY_SSL_HEADER).
# Прокси (Caddy) жіберген тақырыпқа тек Docker желісінен (172.16.0.0/12) немесе
# осы серверден келсе ғана сенеміз; басқа жағдайда — nginx-тің өз схемасы ($scheme).
geo $ozp_trusted_proxy {
    default 0;
    127.0.0.1 1;
    172.16.0.0/12 1;
}

map "$ozp_trusted_proxy:$http_x_forwarded_proto" $ozp_forwarded_proto {
    default $scheme;
    "1:https" https;
}

server {
    listen 80;
    server_name pbbtest.oaiu.kz;

    # Жүктелетін суреттің ең үлкен көлемі
    # Сұрақ формасы: сұрақ суреті + 4 жауап суреті, әрқайсы 2 МБ-қа дейін
    client_max_body_size 12M;

    # collectstatic жинаған CSS/JS
    location /static/ {
        alias /srv/ozp-test/staticfiles/;
        expires 7d;
    }

    # Оқытушы жүктеген суреттер
    location /media/ {
        alias /srv/ozp-test/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ozp_forwarded_proto;
    }
}
